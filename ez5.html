<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speciális Fejlődés - CyberWorkout</title>
    <link rel="stylesheet" href="c1.css">
</head>
<body>

<div class="main-wrapper">
    <!-- Felső Bár -->
    <div class="top-bar">
        <a href="index.html" class="back-btn">← Főmenü</a>
        <div class="streak-counter">⚡ SPECIAL PROTOCOL</div>
    </div>

    <!-- Dátum / Navigáció -->
    <div class="calendar-nav">
        <button class="nav-btn" id="prev-day">← Előző</button>
        <span class="date-label" id="current-day-label">KEDD: LÁB & ACHILLES</span>
        <button class="nav-btn" id="next-day">Következő →</button>
    </div>

    <!-- Fő Kártya -->
    <div class="cloud-card" id="workout-card">
        <h2 id="workout-title">🔥 HETI MENTÁLIS ÉS FIZIKAI PROGRAM</h2>
        
        <ul class="task-list" id="task-container">
            <!-- JS fogja dinamikusan feltölteni -->
        </ul>
    </div>
</div>

<script src="j4.js"></script>
</body>
</html>
